{% extends 'base.html' %}{% block content %}<section class="card"><p class="eyebrow">ASSESSMENT</p><h1>❓ Internet Basics Quiz</h1><p>Answer all 10 questions. You need 70% or more to pass.</p><form method="post">{% for q in questions %}<div class="question"><h3>{{ loop.index }}. {{ q[0] }}</h3>{% for option in q[1] %}<label class="option"><input type="radio" name="q{{ loop.index }}" value="{{ option }}" required> {{ option }}</label>{% endfor %}</div>{% endfor %}<button class="button teal">Submit Quiz</button></form></section>{% endblock %}
